name: Build ZIP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven
        run: mvn -B -DskipTests package

      - name: Create distribution ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = mvn -q -DforceStdout help:evaluate "-Dexpression=project.version"
          $jar = "target/eMetrykant-$version.jar"
          $lib = "target/lib"
          if (-not (Test-Path $jar)) { throw "Brak pliku $jar" }
          if (-not (Test-Path $lib)) { throw "Brak katalogu $lib z zależnościami" }
          $outDir = "target/dist"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $zip = Join-Path $outDir "eMetrykant-$version.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path $jar, $lib -DestinationPath $zip
          Write-Host "Utworzono $zip"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: eMetrykant-zip
          path: target/dist/eMetrykant-*.zip
          if-no-files-found: error
